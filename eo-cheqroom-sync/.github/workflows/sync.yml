name: Sync Cheqroom orders

on:
  # Lets you click "Run workflow" in the Actions tab to test manually first.
  workflow_dispatch: {}

  schedule:
    # Every 15 minutes. GitHub may delay this by a few minutes during busy
    # periods — that's normal and fine for this use case.
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        env:
          CHEQROOM_API_KEY: ${{ secrets.CHEQROOM_API_KEY }}
        run: python sync_cheqroom.py

      - name: Prepare Pages upload
        uses: actions/configure-pages@v5

      - name: Upload the docs folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
