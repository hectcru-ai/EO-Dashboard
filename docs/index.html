<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EO Weekly Order Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6FA;
    --panel: #ECEDF5;
    --card: #ffffff;
    --ink: #1A1B29;
    --muted: #6B7280;
    --line: #E3E5EF;
    --accent: #6C5DD3;
    --accent-light: #A996FF;
    --header-bg: #14122A;
    --day-muted: #9A93BE;
    --warning: #F2724A;
    --teal: #2DD4BF;
    --teal-strong: #0D9488;
    --checkout-bg: #ECE7FC;
    --checkout-border: #CDBEF2;
    --checkin-bg: #FDE7DC;
    --checkin-border: #F6C0A0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px 20px 60px;
    font-size: 16px;
  }
  h1, .display { font-family: 'Oswald', sans-serif; }
  .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: var(--header-bg); color: #fff; padding: 20px 24px; border-radius: 10px; }
  .kicker { font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.06em; color: var(--accent-light); font-weight: 600; }
  h1 { font-weight: 600; font-size: 32px; margin: 2px 0 0; color: #fff; }
  .initials-box { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #C7C2DC; }
  .chip { font-family: 'Oswald', sans-serif; background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 6px 12px; font-size: 15px; cursor: pointer; }
  input#initialsInput { width: 70px; border: 1px solid #D4D7E3; border-radius: 4px; padding: 6px 9px; font-size: 15px; font-family: inherit; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 4px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .sync-bar { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; margin-top: 14px; font-size: 14.5px; }
  .sync-text { color: var(--muted); }
  .sync-text.error { color: var(--warning); }
  .sync-note { font-size: 13px; color: #5B6470; background: #EFF3F9; border: 1px solid #D7E2F0; border-radius: 6px; padding: 8px 12px; margin-top: 8px; }
  .week-nav { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .nav-btn { border: 1px solid #D4D7E3; background: #fff; border-radius: 4px; padding: 7px 12px; cursor: pointer; font-size: 15px; }
  .week-label { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700; color: var(--accent); min-width: 150px; }
  .today-btn { border: 1px solid #D4D7E3; background: #fff; border-radius: 4px; padding: 7px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
  .filter-btn { border: 1px solid #D4D7E3; background: #fff; border-radius: 20px; padding: 7px 14px; font-size: 13.5px; cursor: pointer; color: var(--ink); font-weight: 600; }
  .filter-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .day-col { background: var(--header-bg); border-radius: 8px; padding: 12px; min-height: 200px; flex: 1 1 220px; min-width: 220px; scroll-snap-align: start; }
  .day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.14); }
  .day-name { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; }
  .day-date { font-size: 15px; color: var(--day-muted); }
  .day-count-split { display: flex; gap: 5px; font-family: 'Oswald', sans-serif; font-size: 19px; font-weight: 700; }
  .split-out { color: var(--accent); background: var(--checkout-bg); border-radius: 10px; padding: 3px 10px; }
  .split-in { color: var(--warning); background: var(--checkin-bg); border-radius: 10px; padding: 3px 10px; }
  .card-stack { display: flex; flex-direction: column; gap: 8px; }
  .todo-card { background: none; border: 1.5px dashed var(--teal); border-radius: 6px; padding: 9px 10px; margin-bottom: 10px; }
  .todo-head { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13.5px; color: var(--teal); margin-bottom: 6px; letter-spacing: 0.02em; }
  .todo-item { display: flex; align-items: flex-start; gap: 6px; font-size: 14px; padding: 3px 0; color: var(--teal); }
  .todo-item input[type=checkbox] { margin-top: 3px; cursor: pointer; flex-shrink: 0; }
  .todo-text { flex: 1; word-break: break-word; white-space: pre-wrap; }
  .todo-item.done .todo-text { text-decoration: line-through; color: #6B7A78; }
  .todo-del { border: none; background: none; color: var(--warning); cursor: pointer; font-size: 13px; padding: 0 0 0 4px; flex-shrink: 0; }
  .todo-add { display: flex; gap: 5px; margin-top: 6px; }
  .todo-add input { flex: 1; min-width: 0; border: 1px solid #C9C1AD; border-radius: 4px; padding: 5px 7px; font-size: 13px; font-family: inherit; background: #fff; }
  .todo-add button { border: none; background: var(--teal-strong); color: #fff; border-radius: 4px; padding: 5px 11px; cursor: pointer; font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .card-notes { background: rgba(255,255,255,0.6); border: 1px solid rgba(242,114,74,0.35); border-radius: 5px; padding: 7px 8px; margin-top: 6px; }
  .note-item { display: flex; align-items: flex-start; gap: 6px; font-size: 13.5px; padding: 2px 0; color: var(--ink); }
  .note-item input[type=checkbox] { margin-top: 3px; cursor: pointer; flex-shrink: 0; }
  .note-item-text { flex: 1; word-break: break-word; white-space: pre-wrap; }
  .note-item.done .note-item-text { text-decoration: line-through; color: var(--muted); }
  .note-item-del { border: none; background: none; color: var(--warning); cursor: pointer; font-size: 12px; padding: 0 0 0 4px; flex-shrink: 0; }
  .note-add { display: flex; gap: 5px; margin-top: 4px; }
  .note-add input { flex: 1; min-width: 0; border: 1px solid #F0C7B5; border-radius: 4px; padding: 4px 6px; font-size: 12.5px; font-family: inherit; background: #fff; }
  .note-add button { border: none; background: var(--warning); color: #fff; border-radius: 4px; padding: 4px 9px; cursor: pointer; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .empty-day { font-size: 14.5px; color: #726C96; font-style: italic; padding: 10px 2px; }
  .card { border-radius: 6px; padding: 11px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .card.checkout { background: var(--checkout-bg); border: 1px solid var(--checkout-border); }
  .card.checkin { background: var(--checkin-bg); border: 1px solid var(--checkin-border); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .card-name { display: flex; align-items: center; gap: 5px; font-size: 15.5px; font-weight: 600; }
  .cheqroom-tag { font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.08); border-radius: 3px; padding: 2px 6px; white-space: nowrap; font-weight: 600; }
  .grade-badge { display: inline-block; font-size: 13px; font-weight: 700; color: #1A1D21; background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.12); border-radius: 4px; padding: 2px 8px; margin-top: 5px; }
  .grade-badge.professor { background: var(--accent); color: #fff; border-color: var(--accent); }
  .card.checkout.priority, .card.checkin.priority { border-left: 5px solid var(--accent); padding-left: 9px; }
  .type-tag { font-family: 'Oswald', sans-serif; font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 2px 7px; white-space: nowrap; flex-shrink: 0; }
  .type-tag.out { color: var(--accent); background: rgba(255,255,255,0.8); border: 1px solid var(--checkout-border); }
  .type-tag.in { color: var(--warning); background: rgba(255,255,255,0.8); border: 1px solid var(--checkin-border); }
  .order-name { font-size: 12.5px; font-style: italic; color: #4B4F55; margin-top: 3px; }
  .approval-badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 4px; padding: 2px 8px; margin-top: 5px; }
  .email-approval-badge { display: block; font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 8px; margin-top: 5px; }
  .email-approval-badge.approved { color: #1E7A75; background: #E4F3F1; }
  .email-approval-badge.denied { color: var(--warning); background: #FDEAE2; }
  .permit-waived-badge { display: block; font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 8px; margin-top: 5px; color: #1E7A75; background: #E4F3F1; }
  .coi-card-badge { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .coi-unassign { border: none; background: none; color: inherit; opacity: 0.65; cursor: pointer; font-size: 11px; text-decoration: underline; padding: 0; font-weight: 500; }
  .coi-panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; margin-top: 10px; }
  .coi-panel-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; }
  .panel-header { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; margin-bottom: 8px; }
  .panel-header:hover { opacity: 0.85; }
  .panel-toggle-arrow { font-size: 11px; color: var(--muted); width: 10px; flex-shrink: 0; }
  .coi-item-row { border-top: 1px solid var(--line); padding: 7px 0; }
  .coi-item-row:first-of-type { border-top: none; }
  .coi-item { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13.5px; }
  .coi-item-subject { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-word; }
  .coi-item-badge { font-weight: 700; border-radius: 4px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
  .coi-item-badge.approved { color: #1E7A75; background: #E4F3F1; }
  .coi-item-badge.denied { color: var(--warning); background: #FDEAE2; }
  .coi-item-meta { color: var(--muted); flex: 1; min-width: 160px; }
  .coi-assign-select { border: 1px solid #D4D7E3; border-radius: 4px; padding: 5px 7px; font-size: 13px; font-family: inherit; max-width: 100%; }
  .overdue-panel { background: var(--card); border: 1px solid var(--warning); border-radius: 6px; padding: 10px 14px; margin-top: 10px; }
  .overdue-panel-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; color: var(--warning); }
  .overdue-item { margin-bottom: 10px; }
  .overdue-item:last-child { margin-bottom: 0; }
  .overdue-days { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--warning); margin-bottom: 4px; }
  .card-meta { display: flex; align-items: center; gap: 4px; font-size: 14px; color: #3F444B; margin-top: 5px; }
  select.status-select { width: 100%; margin-top: 9px; border: 1px solid rgba(0,0,0,0.15); border-radius: 4px; padding: 7px 8px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; background: #fff; color: var(--ink); }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; font-size: 11.5px; color: #4B4F55; }
  .edit-link { border: none; background: none; color: #2C4A8C; cursor: pointer; font-size: 13px; padding: 0; font-weight: 600; }
  .card-footer-links { display: flex; align-items: center; gap: 10px; }
  .hide-link { color: var(--muted) !important; opacity: 0.8; }
  .hidden-panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; margin-top: 10px; }
  .hidden-panel-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; color: var(--muted); }
  .hidden-item-label { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }

</style>
</head>
<body>

  <div class="header">
    <div>
      <div class="kicker">Weekly Order Board</div>
      <h1>Regent Equipment Office</h1>
    </div>
    <div class="initials-box">
      Signed in as
      <span id="initialsDisplay"></span>
    </div>
  </div>

  <div class="sync-bar">
    <span id="syncText" class="sync-text">Loading…</span>
  </div>
  <div class="sync-note">ℹ️ Changes made in Cheqroom (new orders, status updates, check-ins) can take up to <strong>~15 minutes</strong> to appear here — this page pulls from Cheqroom on a timer, not instantly.</div>

  <div class="coi-panel" id="coiPanel" style="display:none;"></div>

  <div class="coi-panel" id="dismissedCoiPanel" style="display:none;"></div>

  <div class="hidden-panel" id="hiddenPanel" style="display:none;"></div>

  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-7)">‹</button>
    <div class="week-label" id="weekLabel"></div>
    <button class="nav-btn" onclick="changeWeek(7)">›</button>
    <button class="today-btn" onclick="goToday()">This week</button>
    <div style="flex:1"></div>
    <button class="filter-btn" id="profFilterBtn" onclick="toggleProfFilter()">🎓 Professor orders only</button>
  </div>

  <div class="board" id="board"></div>

  <div class="overdue-panel" id="overduePanel" style="display:none;"></div>

<script>
// =============================================================================
// CONFIG — fill these in after setup
// =============================================================================
const ORDERS_FEED_URL = "./orders.json"; // same-origin, no CORS issue
const FIREBASE_DB_URL = "https://eo-dashboard-dc334-default-rtdb.firebaseio.com/"; // e.g. https://your-project-default-rtdb.firebaseio.com

// =============================================================================
// Status model
// =============================================================================
const STATUSES = [
  { id: "not_started", label: "Not started",  color: "#8A8F98", bg: "#EFEDE7" },
  { id: "building", label: "Building",         color: "#7A4FA6", bg: "#F1E9F6" },
  { id: "built",    label: "Built — ready",    color: "#1E7A75", bg: "#E4F3F1" },
  { id: "out",      label: "Checked out",      color: "#5B6470", bg: "#EAECEE" },
  { id: "in",       label: "Needs check in",   color: "#357A3E", bg: "#E7F3E8" },
  { id: "checked_in", label: "Checked In",     color: "#2C4A8C", bg: "#E8EDF7" },
];
const statusById = (id) => STATUSES.find(s => s.id === id) || STATUSES[0];
// Orders saved under the old 6-status model may still carry "pending" or
// "approved" in Firebase — map those forward so old data doesn't show up
// as an unselected/blank dropdown.
const LEGACY_STATUS_MAP = { pending: "not_started", approved: "not_started" };
const CHEQROOM_STATUS_LABEL = {
  creating: "Draft — gear may change", open: "Open", closed: "Closed",
  closed_manually: "Closed (manual)", cancelled: "Cancelled", archived: "Archived",
};
const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

// =============================================================================
// State
// =============================================================================
let feedOrders = [];
let feedGeneratedAt = null;
let staffData = {}; // { [reservationNumber]: {status, note, updatedBy, updatedAt} } — keyed by reservation number, not
                     // Cheqroom's internal ID, since that ID can change when a reservation is edited
let dayNotes = {}; // { "yyyy-mm-dd": [{id, text, done, addedBy, addedAt}] }
let emailApprovals = {}; // { "RESERVATION-1234": {decision, professor, receivedAt} } — written by Power Automate
let coiApprovals = {}; // { [pushId]: {name, dateIso, status, subject, receivedAt, assignedCheqroomId} } — COI emails have no
                        // reservation number, so each entry starts unassigned and staff link it to an order by hand in the UI
let weekMonday = getMonday(new Date());
let professorOnly = false;

// =============================================================================
// Date helpers
// =============================================================================
// Cheqroom's internal ID for a reservation can change when it's edited (adding
// items, etc. — see staff guide/system notes). The reservation number printed on
// the order is more stable, so staff-entered data (status, notes, COI assignment)
// is keyed by that instead, falling back to the internal ID only if a reservation
// number is somehow missing.
function staffKey(o) {
  return o.reservationNumber || o.cheqroomId;
}

function toISODate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day));
  date.setHours(0,0,0,0);
  return date;
}
function addDays(d, n) { const date = new Date(d); date.setDate(date.getDate()+n); return date; }
function formatShort(d) { return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function formatRange(monday) {
  const friday = addDays(monday, 4);
  if (monday.getMonth() === friday.getMonth()) {
    return `${monday.toLocaleDateString("en-US",{month:"short"})} ${monday.getDate()}–${friday.getDate()}`;
  }
  return `${formatShort(monday)} – ${formatShort(friday)}`;
}
function relTime(ts) {
  if (!ts) return "never";
  const min = Math.round((Date.now()-ts)/60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min}m ago`;
  const hr = Math.round(min/60);
  if (hr < 24) return `${hr}h ago`;
  return `${Math.round(hr/24)}d ago`;
}
function timeSortValue(timeStr) {
  // Cards store a display-formatted time like "1:30 PM" or "10:00 AM" — comparing
  // those as plain text doesn't reliably sort chronologically (a mix of digits,
  // ":", a space, and AM/PM letters doesn't compare the way you'd expect). Convert
  // to minutes-since-midnight instead, so sorting is by actual time of day.
  if (!timeStr) return -1; // no time set — keep these first, same as before
  const m = timeStr.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (!m) return -1; // unrecognized format — don't let it break the sort
  let hour = parseInt(m[1], 10) % 12;
  const minute = parseInt(m[2], 10);
  if (/pm/i.test(m[3])) hour += 12;
  return hour * 60 + minute;
}

// =============================================================================
// Collapsible panels (per-device, plain localStorage) — Overdue/COI/Hidden lists
// =============================================================================
let collapsedPanels = {};
try {
  collapsedPanels = JSON.parse(localStorage.getItem("eo-collapsed-panels") || "{}");
} catch (err) {
  collapsedPanels = {};
}
function togglePanelCollapse(key) {
  collapsedPanels[key] = !collapsedPanels[key];
  localStorage.setItem("eo-collapsed-panels", JSON.stringify(collapsedPanels));
  render();
}
function renderCollapsiblePanel(elId, key, count, titleHtml, bodyHtml) {
  const el = document.getElementById(elId);
  if (count === 0) {
    el.style.display = "none";
    el.innerHTML = "";
    return;
  }
  el.style.display = "block";
  const collapsed = !!collapsedPanels[key];
  el.innerHTML = `
    <div class="panel-header" onclick="togglePanelCollapse('${key}')">
      <span class="panel-toggle-arrow">${collapsed ? "▸" : "▾"}</span>
      ${titleHtml}
    </div>
    ${collapsed ? "" : bodyHtml}
  `;
}

// =============================================================================
// Initials (per-device, plain localStorage — fine since it's just a personal label)
// =============================================================================
function getInitials() { return localStorage.getItem("eo-initials") || ""; }
function renderInitials() {
  const el = document.getElementById("initialsDisplay");
  const current = getInitials();
  if (current) {
    el.innerHTML = `<button class="chip" onclick="promptInitials()">${current}</button>`;
  } else {
    el.innerHTML = `<button class="btn" onclick="promptInitials()">Set initials</button>`;
  }
}
function promptInitials() {
  const val = prompt("Your initials (shown next to updates you make):", getInitials());
  if (val && val.trim()) {
    localStorage.setItem("eo-initials", val.trim().toUpperCase().slice(0,4));
    renderInitials();
  }
}

// =============================================================================
// Fetch the Cheqroom feed (same-origin static file, refreshed every 15 min by GitHub Action)
// =============================================================================
async function fetchFeed() {
  try {
    const res = await fetch(ORDERS_FEED_URL + "?t=" + Date.now()); // cache-bust
    if (!res.ok) throw new Error(`Feed returned ${res.status}`);
    const data = await res.json();
    feedOrders = Array.isArray(data.orders) ? data.orders : [];
    feedGeneratedAt = data.generatedAt || null;
    document.getElementById("syncText").textContent =
      `Synced from Cheqroom · last updated ${relTime(feedGeneratedAt ? new Date(feedGeneratedAt).getTime() : null)}`;
    document.getElementById("syncText").classList.remove("error");
  } catch (err) {
    document.getElementById("syncText").textContent = `Couldn't reach the Cheqroom feed (${err.message}).`;
    document.getElementById("syncText").classList.add("error");
  } finally {
    render();
  }
}

// =============================================================================
// Fetch / write staff status data via Firebase Realtime Database REST API
// =============================================================================
async function fetchStaffData() {
  if (FIREBASE_DB_URL.startsWith("REPLACE_")) return; // not configured yet
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/staffData.json`);
    if (!res.ok) throw new Error(`Firebase read returned ${res.status}`);
    const data = await res.json();
    staffData = data || {};
    document.getElementById("firebaseError")?.remove();
  } catch (err) {
    console.error("Couldn't reach Firebase:", err);
    showFirebaseError(`Can't load saved statuses (${err.message}).`);
  }
  render();
}

async function updateStaffField(orderKey, patch) {
  const existing = staffData[orderKey] || {};
  const updated = {
    ...existing,
    ...patch,
    updatedBy: getInitials() || existing.updatedBy || "—",
    updatedAt: Date.now(),
  };
  staffData[orderKey] = updated;
  render(); // optimistic update
  if (FIREBASE_DB_URL.startsWith("REPLACE_")) return;
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/staffData/${orderKey}.json`, {
      method: "PUT",
      body: JSON.stringify(updated),
    });
    if (!res.ok) throw new Error(`Firebase write returned ${res.status}`);
    document.getElementById("firebaseError")?.remove();
  } catch (err) {
    console.error("Couldn't save to Firebase:", err);
    showFirebaseError(`Your change didn't save (${err.message}). It'll be lost on refresh.`);
  }
}

function showFirebaseError(message) {
  let el = document.getElementById("firebaseError");
  if (!el) {
    el = document.createElement("div");
    el.id = "firebaseError";
    el.style.cssText = "background:#FDEAE2;color:#F2724A;border:1px solid #F5C9B5;border-radius:6px;padding:8px 12px;margin-top:10px;font-size:12.5px;";
    document.querySelector(".sync-bar").insertAdjacentElement("afterend", el);
  }
  el.textContent = message;
}

function addTodo(dateIso) {
  const inputEl = document.getElementById(`todo-input-${dateIso}`);
  const text = inputEl.value.trim();
  if (!text) return;
  const items = [...(dayNotes[dateIso] || [])];
  items.push({
    id: "t" + Date.now() + Math.random().toString(36).slice(2, 7),
    text,
    done: false,
    addedBy: getInitials() || "—",
    addedAt: Date.now(),
  });
  saveDayNotes(dateIso, items);
  // saveDayNotes triggers a full re-render, which clears this input naturally
  // since it's rebuilt fresh — no manual reset needed.
}

function toggleTodo(dateIso, id) {
  const items = (dayNotes[dateIso] || []).map(t => t.id === id ? { ...t, done: !t.done } : t);
  saveDayNotes(dateIso, items);
}

function deleteTodo(dateIso, id) {
  const items = (dayNotes[dateIso] || []).filter(t => t.id !== id);
  saveDayNotes(dateIso, items);
}

function todoKeydown(event, dateIso) {
  if (event.key === "Enter") addTodo(dateIso);
}

// =============================================================================
// Per-card notes — same checklist pattern as the All-Staff priorities above,
// but keyed by order (staffKey) instead of date, and stored under staffData.
// A legacy single-string `note` (from before this feature) is folded in as one
// unchecked item at render time and cleared once the list is touched again.
// =============================================================================
function getNoteItemsWithLegacy(orderKey) {
  const existing = staffData[orderKey] || {};
  if (existing.noteItems && existing.noteItems.length) return existing.noteItems;
  if (existing.note) {
    // A note saved before this checklist existed — show it as one unchecked
    // item; it gets converted for real the moment any action touches it.
    return [{ id: "legacy-note", text: existing.note, done: false, addedBy: existing.updatedBy || "—", addedAt: existing.updatedAt || Date.now() }];
  }
  return [];
}

function addNoteItem(orderKey) {
  const inputEl = document.getElementById(`note-input-${orderKey}`);
  const text = inputEl.value.trim();
  if (!text) return;
  const items = [...getNoteItemsWithLegacy(orderKey)];
  items.push({
    id: "n" + Date.now() + Math.random().toString(36).slice(2, 7),
    text,
    done: false,
    addedBy: getInitials() || "—",
    addedAt: Date.now(),
  });
  updateStaffField(orderKey, { noteItems: items, note: null }); // clear legacy string once items exist
}

function toggleNoteItem(orderKey, id) {
  const items = getNoteItemsWithLegacy(orderKey).map(t => t.id === id ? { ...t, done: !t.done } : t);
  updateStaffField(orderKey, { noteItems: items, note: null });
}

function deleteNoteItem(orderKey, id) {
  const items = getNoteItemsWithLegacy(orderKey).filter(t => t.id !== id);
  updateStaffField(orderKey, { noteItems: items, note: null });
}

function noteItemKeydown(event, orderKey) {
  if (event.key === "Enter") addNoteItem(orderKey);
}

// =============================================================================
// Rendering
// =============================================================================
function getWeekDays() {
  return DAY_NAMES.map((name, i) => ({ name, date: addDays(weekMonday, i) }));
}

function render() {
  document.getElementById("weekLabel").textContent = formatRange(weekMonday);

  const btn = document.getElementById("profFilterBtn");
  if (btn) {
    btn.classList.toggle("active", professorOnly);
    btn.textContent = professorOnly ? "🎓 Showing professors only" : "🎓 Professor orders only";
  }

  // If the user is mid-typing into an "add a priority" or "add a note" box when
  // a background refresh fires, capture it so we can restore it after
  // re-rendering — otherwise a full re-render replaces that input with a blank one.
  const active = document.activeElement;
  let draft = null;
  if (active && active.id && (active.id.startsWith("todo-input-") || active.id.startsWith("note-input-"))) {
    draft = { id: active.id, value: active.value, selectionStart: active.selectionStart, selectionEnd: active.selectionEnd };
  }

  // Split COI entries into ones already linked to an order vs. ones still
  // needing a staff member to pick the right order by hand. Keyed by reservation
  // number now (see staffKey) — old entries may still carry assignedCheqroomId
  // from before this fix, so we read that as a fallback but never write it again.
  // Unassigned entries further split into active vs. dismissed — dismissing is a
  // reversible "get this out of my way for now" action, separate from the
  // permanent "remove" delete.
  const coiByOrderKey = {};
  const unassignedCoi = [];
  const dismissedCoi = [];
  Object.entries(coiApprovals).forEach(([entryId, entry]) => {
    const assignedKey = entry.assignedReservationNumber || entry.assignedCheqroomId;
    if (assignedKey) {
      coiByOrderKey[assignedKey] = { ...entry, entryId };
    } else if (entry.dismissed) {
      dismissedCoi.push({ ...entry, entryId });
    } else {
      unassignedCoi.push({ ...entry, entryId });
    }
  });
  unassignedCoi.sort((a, b) => (b.receivedAt || 0) - (a.receivedAt || 0));
  dismissedCoi.sort((a, b) => (b.receivedAt || 0) - (a.receivedAt || 0));

  const todayIso = toISODate(new Date());

  let allOrders = feedOrders.map(o => {
    const key = staffKey(o);
    const staff = staffData[key] || {};
    const emailApproval = emailApprovals[o.reservationNumber] || null;
    const coiApproval = coiByOrderKey[key] || null;
    const rawStatus = staff.status || "not_started";
    const staffStatus = LEGACY_STATUS_MAP[rawStatus] || rawStatus;
    return { ...o, staffStatus, note: staff.note || "", noteItems: getNoteItemsWithLegacy(key),
             updatedBy: staff.updatedBy || "", updatedAt: staff.updatedAt || null,
             emailApproval, coiApproval, hidden: !!staff.hidden };
  });

  // Manually hidden — a staff override for orders that linger on the board despite
  // being closed/deleted in Cheqroom (usually a sync delay or Cheqroom-side lag,
  // not something the sync script itself can force to resolve faster). Hidden
  // orders are fully excluded from the normal board and overdue panel, but kept
  // reviewable/reversible in their own panel rather than silently discarded.
  const hiddenOrders = allOrders.filter(o => o.hidden);
  const visibleOrders = allOrders.filter(o => !o.hidden);

  // Overdue check-ins — still "open" in Cheqroom past their due date, meaning
  // they haven't actually been returned. Computed from the full list so they
  // surface regardless of the professor-only filter or which week is displayed.
  const overdueCheckins = visibleOrders
    .filter(o => o.action === "checkin" && o.cheqroomStatus === "open" && o.date && o.date < todayIso)
    .sort((a, b) => b.date.localeCompare(a.date)); // most recently overdue first, oldest at the bottom

  let orders = visibleOrders;
  if (professorOnly) {
    orders = orders.filter(o => (o.gradeLevel || "").toUpperCase().includes("PROFESSOR"));
  }

  const weekDays = getWeekDays();
  const ordersByDay = {};
  weekDays.forEach(d => ordersByDay[toISODate(d.date)] = []);
  orders.forEach(o => { if (ordersByDay[o.date]) ordersByDay[o.date].push(o); });
  Object.values(ordersByDay).forEach(list => list.sort((a, b) => timeSortValue(a.time) - timeSortValue(b.time)));

  // board
  document.getElementById("board").innerHTML = weekDays.map((d,i) => {
    const iso = toISODate(d.date);
    const dayOrders = ordersByDay[iso] || [];
    const isToday = iso === todayIso;
    const outCount = dayOrders.filter(o => o.action !== "checkin").length;
    const inCount = dayOrders.filter(o => o.action === "checkin").length;
    return `
      <div class="day-col" id="daycol-${i}">
        <div class="day-head">
          <div>
            <div class="day-name" style="color:${isToday?'var(--accent-light)':'#fff'}">${d.name}</div>
            <div class="day-date">${formatShort(d.date)}</div>
          </div>
          <div class="day-count-split">
            <span class="split-out">↪${outCount}</span>
            <span class="split-in">↩${inCount}</span>
          </div>
        </div>
        <div class="card-stack">
          ${todoCardHtml(iso)}
          ${dayOrders.length === 0 ? '<div class="empty-day">No orders this day</div>' : ''}
          ${dayOrders.map(o => cardHtml(o)).join("")}
        </div>
      </div>`;
  }).join("");

  // overdue check-ins panel (shown regardless of which week is selected)
  renderCollapsiblePanel(
    "overduePanel", "overdue", overdueCheckins.length,
    `<span class="overdue-panel-title">⚠️ Overdue check-ins (${overdueCheckins.length})</span>`,
    `<div class="card-stack">${overdueCheckins.map(o => overdueItemHtml(o)).join("")}</div>`
  );

  // unassigned COI approvals panel (shown regardless of which week is selected)
  renderCollapsiblePanel(
    "coiPanel", "coi", unassignedCoi.length,
    `<span class="coi-panel-title">📋 Unassigned COI approvals (${unassignedCoi.length})</span>`,
    unassignedCoi.map(entry => coiUnassignedItemHtml(entry)).join("")
  );

  // dismissed COI approvals — reversibly tucked away, not deleted (see "remove" for that)
  renderCollapsiblePanel(
    "dismissedCoiPanel", "dismissedCoi", dismissedCoi.length,
    `<span class="coi-panel-title">🙈 Dismissed COI approvals (${dismissedCoi.length})</span>`,
    dismissedCoi.map(entry => dismissedCoiItemHtml(entry)).join("")
  );

  // hidden orders panel — manually hidden by staff (e.g. lingering despite being
  // closed/deleted in Cheqroom); kept reviewable/reversible rather than discarded
  renderCollapsiblePanel(
    "hiddenPanel", "hidden", hiddenOrders.length,
    `<span class="hidden-panel-title">🙈 Hidden orders (${hiddenOrders.length})</span>`,
    `<div class="card-stack">${hiddenOrders.map(o => hiddenItemHtml(o)).join("")}</div>`
  );

  // restore whatever was being typed, and put the cursor back where it was
  if (draft) {
    const el = document.getElementById(draft.id);
    if (el) {
      el.value = draft.value;
      el.focus();
      el.setSelectionRange(draft.selectionStart, draft.selectionEnd);
    }
  }
}

function todoCardHtml(dateIso) {
  const items = dayNotes[dateIso] || [];
  return `
    <div class="todo-card">
      <div class="todo-head">📌 All Staff</div>
      ${items.map(t => `
        <div class="todo-item ${t.done ? "done" : ""}">
          <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTodo('${dateIso}','${t.id}')" />
          <span class="todo-text">${escapeHtml(t.text)}</span>
          <button class="todo-del" onclick="deleteTodo('${dateIso}','${t.id}')" title="Remove">✕</button>
        </div>`).join("")}
      <div class="todo-add">
        <input type="text" id="todo-input-${dateIso}" placeholder="Add a priority…" onkeydown="todoKeydown(event, '${dateIso}')" />
        <button onclick="addTodo('${dateIso}')">+</button>
      </div>
    </div>`;
}

function noteItemsHtml(o) {
  const key = staffKey(o);
  const items = o.noteItems || [];
  return `
    <div class="card-notes">
      ${items.map(t => `
        <div class="note-item ${t.done ? "done" : ""}">
          <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleNoteItem('${key}','${t.id}')" />
          <span class="note-item-text">${escapeHtml(t.text)}</span>
          <button class="note-item-del" onclick="deleteNoteItem('${key}','${t.id}')" title="Remove">✕</button>
        </div>`).join("")}
      <div class="note-add">
        <input type="text" id="note-input-${key}" placeholder="Add a note…" onkeydown="noteItemKeydown(event, '${key}')" />
        <button onclick="addNoteItem('${key}')">+</button>
      </div>
    </div>`;
}

function cardHtml(o) {
  const isCheckin = o.action === "checkin";
  const isProfessor = (o.gradeLevel || "").toUpperCase().includes("PROFESSOR");
  const approval = approvalBadgeStyle(o.approvalLabel);
  return `
    <div class="card ${isCheckin ? 'checkin' : 'checkout'}${isProfessor ? ' priority' : ''}">
      <div class="card-top">
        <div class="card-name">${escapeHtml(o.name)}</div>
        <span class="type-tag ${isCheckin ? 'in' : 'out'}">${isCheckin ? '↩ Check-in' : '↪ Check-out'}</span>
      </div>
      ${o.orderName ? `<div class="order-name">${escapeHtml(o.orderName)}</div>` : ""}
      ${o.gradeLevel ? `<div class="grade-badge${isProfessor ? ' professor' : ''}">🎓 ${escapeHtml(o.gradeLevel)}</div>` : ""}
      ${approval ? `<div class="approval-badge" style="color:${approval.color};background:${approval.bg}">${escapeHtml(o.approvalLabel)}</div>` : ""}
      ${emailApprovalBadgeHtml(o.emailApproval)}
      ${permitWaivedBadgeHtml(o.emailApproval)}
      ${coiApprovalBadgeHtml(o.coiApproval)}
      ${o.time ? `<div class="card-meta">🕐 ${escapeHtml(o.time)}</div>` : ""}
      ${o.items ? `<div class="card-meta">📦 ${escapeHtml(o.items)}</div>` : ""}
      ${noteItemsHtml(o)}
      <select class="status-select"
              onchange="updateStaffField('${staffKey(o)}', {status: this.value})">
        ${STATUSES.map(st => `<option value="${st.id}" ${st.id===o.staffStatus?"selected":""}>${st.label}</option>`).join("")}
      </select>
      <div class="card-footer">
        ${o.hidden
          ? `<button class="edit-link hide-link" onclick="unhideOrder('${staffKey(o)}')">Unhide</button>`
          : `<button class="edit-link hide-link" onclick="hideOrder('${staffKey(o)}')">Hide</button>`}
        <span>${o.updatedBy ? o.updatedBy + " · " : ""}${o.updatedAt ? relTime(o.updatedAt) : ""}</span>
      </div>
    </div>`;
}

function emailApprovalBadgeHtml(emailApproval) {
  if (!emailApproval || !emailApproval.decision) return "";
  const decision = emailApproval.decision.toLowerCase();
  const prof = emailApproval.professor ? escapeHtml(emailApproval.professor) : "";
  if (decision === "approved") {
    return `<div class="email-approval-badge approved">✅ ${prof}</div>`;
  }
  if (decision === "denied") {
    return `<div class="email-approval-badge denied">❌ ${prof}</div>`;
  }
  return "";
}

function permitWaivedBadgeHtml(emailApproval) {
  if (!emailApproval || !emailApproval.permitWaived) return "";
  return `<div class="permit-waived-badge">✅ In-class</div>`;
}

function overdueItemHtml(o) {
  const due = new Date(o.date + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.max(0, Math.round((today - due) / 86400000));
  return `
    <div class="overdue-item">
      <div class="overdue-days">${days} day${days === 1 ? "" : "s"} overdue — was due ${o.date}${o.time ? " " + o.time : ""}</div>
      ${cardHtml(o)}
    </div>`;
}

function hiddenItemHtml(o) {
  return `
    <div class="overdue-item">
      <div class="hidden-item-label">🙈 Hidden from the board — was ${o.date}${o.time ? " " + o.time : ""}</div>
      ${cardHtml(o)}
    </div>`;
}

function coiApprovalBadgeHtml(coiApproval) {
  if (!coiApproval) return "";
  const isDenied = coiApproval.status === "denied";
  return `
    <div class="email-approval-badge ${isDenied ? "denied" : "approved"} coi-card-badge">
      <span>${isDenied ? "❌ COI denied" : "✅ COI approved"}</span>
      <button class="coi-unassign" onclick="unassignCoi('${coiApproval.entryId}')" title="Undo this assignment">unassign</button>
    </div>`;
}

function coiUnassignedItemHtml(entry) {
  // Prefer orders on the same date the COI email named; if none line up
  // (typo, date mismatch, etc.) fall back to showing every order so staff
  // can still find and assign it manually.
  const sameDate = feedOrders.filter(o => o.date === entry.dateIso);
  const candidates = (sameDate.length ? sameDate : feedOrders)
    .slice()
    .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  const options = candidates
    .map(o => `<option value="${staffKey(o)}">${escapeHtml(o.name)} — ${escapeHtml(o.orderName || o.items || "")} (${o.date}${o.time ? " " + o.time : ""})</option>`)
    .join("");
  return `
    <div class="coi-item-row">
      <div class="coi-item">
        <span class="coi-item-badge ${entry.status === "denied" ? "denied" : "approved"}">${entry.status === "denied" ? "❌ Denied" : "✅ Approved"}</span>
        <span class="coi-item-meta">${escapeHtml(entry.name || "Unknown")} · ${escapeHtml(entry.dateIso || "?")}${sameDate.length === 0 ? " (no same-day order found — showing all orders)" : ""}</span>
        <select class="coi-assign-select" onchange="assignCoi('${entry.entryId}', this.value)">
          <option value="">Assign to order…</option>
          ${options}
        </select>
        <button class="coi-unassign" onclick="dismissCoi('${entry.entryId}')" title="Tuck this away for now — reversible, nothing is deleted">hide</button>
        <button class="coi-unassign" onclick="removeCoi('${entry.entryId}')" title="Permanently delete this entry — use when there's no reservation to assign it to">remove</button>
      </div>
      ${entry.subject ? `<div class="coi-item-subject">✉️ ${escapeHtml(entry.subject)}</div>` : ""}
    </div>`;
}

function dismissedCoiItemHtml(entry) {
  return `
    <div class="coi-item-row">
      <div class="coi-item">
        <span class="coi-item-badge ${entry.status === "denied" ? "denied" : "approved"}">${entry.status === "denied" ? "❌ Denied" : "✅ Approved"}</span>
        <span class="coi-item-meta">${escapeHtml(entry.name || "Unknown")} · ${escapeHtml(entry.dateIso || "?")}</span>
        <button class="coi-unassign" onclick="restoreCoi('${entry.entryId}')" title="Bring this back to the Unassigned COI approvals panel">unhide</button>
      </div>
      ${entry.subject ? `<div class="coi-item-subject">✉️ ${escapeHtml(entry.subject)}</div>` : ""}
    </div>`;
}

function approvalBadgeStyle(label) {
  if (!label) return null;
  const l = label.toLowerCase();
  if (l.includes("not approved") || l.includes("denied")) return { color: "#F2724A", bg: "#FDEAE2" };
  if (l.includes("financial fine")) return { color: "#F2724A", bg: "#FDEAE2" };
  if (l === "approved") return { color: "#1E7A75", bg: "#E4F3F1" };
  if (l.includes("pending")) return { color: "#B8862E", bg: "#FBF2E1" };
  if (l.includes("training")) return { color: "#5B6470", bg: "#EAECEE" };
  return null; // unrecognized value (e.g. a raw internal ID) — don't show it at all
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// =============================================================================
// =============================================================================
// Week nav
// =============================================================================
function changeWeek(days) { weekMonday = addDays(weekMonday, days); render(); }
function goToday() { weekMonday = getMonday(new Date()); render(); }
function toggleProfFilter() { professorOnly = !professorOnly; render(); }

// =============================================================================
// Boot
// =============================================================================
renderInitials();
fetchFeed();
fetchStaffData();
fetchDayNotes();
fetchEmailApprovals();
fetchCoiApprovals();
setInterval(fetchFeed, 5 * 60 * 1000);
setInterval(fetchStaffData, 30 * 1000); // pick up other staff's updates every 30s
setInterval(fetchDayNotes, 30 * 1000); // pick up other staff's priority-list edits every 30s
setInterval(fetchEmailApprovals, 30 * 1000); // pick up new professor email replies every 30s
setInterval(fetchCoiApprovals, 30 * 1000); // pick up new COI approvals, and assignments made on other devices, every 30s
</script>
